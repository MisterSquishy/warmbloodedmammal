<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warm-Blooded Mammal</title>
  <meta name="description" content="Warm-Blooded Mammal — new EP MVP, out now.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://warmbloodedmammal.com/">
  <meta property="og:title" content="Warm-Blooded Mammal">
  <meta property="og:description" content="New EP MVP, out now.">
  <meta property="og:image" content="https://warmbloodedmammal.com/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Warm-Blooded Mammal standing on a sidewalk with guitar cases and a Fender amp box">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #15120f;
      --fg: #f2efe9;
      --muted: #8f877d;
      --rule: #4d4740;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      padding: 2rem 1.5rem;
    }

    /* Shrinks to whatever height is left so the page fits one screen; contain keeps the full 4:3 frame */
    .photo {
      flex: 0 1 auto;
      min-height: 200px;
      width: 100%;
      max-width: 820px;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      display: block;
      margin-bottom: 2rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .photo.loaded { opacity: 1; }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .release {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }

    .cover {
      width: 112px;
      height: 112px;
      display: block;
      flex-shrink: 0;
    }

    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .title {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.75rem;
      line-height: 1.2;
      margin: 0.15rem 0 0.5rem;
    }

    .listen {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.1rem;
    }

    .listen a {
      font-size: 0.85rem;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.1rem;
    }

    .listen a:hover { border-color: var(--fg); }

    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .contact a {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }

    .contact a:hover { color: var(--fg); }

    @media (max-width: 480px) {
      .release {
        flex-direction: column;
        text-align: center;
      }
      .listen { justify-content: center; }
    }
  </style>
</head>
<body>

  <img src="band.webp" alt="Warm-Blooded Mammal" class="photo" width="1200" height="900">
  <h1>Warm-Blooded Mammal</h1>

  <section class="release" aria-label="New EP">
    <img src="mvp.webp" alt="MVP EP cover" class="cover" width="320" height="320">
    <div>
      <p class="eyebrow">New EP · Out Now</p>
      <p class="title">MVP</p>
      <nav class="listen" aria-label="Listen to MVP">
        <a href="https://open.spotify.com/album/3jnt5RLGUGhJx6tYVGVbbq" target="_blank" rel="noopener">Spotify</a>
        <a href="https://music.apple.com/us/album/mvp-ep/6813699758" target="_blank" rel="noopener">Apple Music</a>
        <a href="https://www.youtube.com/playlist?list=OLAK5uy_mBTkl0OiElIwPnhfaHx1QZWdFwZe0CKr8" target="_blank" rel="noopener">YouTube</a>
      </nav>
    </div>
  </section>

  <div class="contact">
    <a href="mailto:warmbloodedband@gmail.com">warmbloodedband@gmail.com</a>
    <a href="https://www.instagram.com/warmbloodedmammal_band" target="_blank" rel="noopener">@warmbloodedmammal_band</a>
  </div>

  <script>
    const img = document.querySelector('.photo');
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'));
  </script>
</body>
</html>
