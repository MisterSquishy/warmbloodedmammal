<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warm-Blooded Mammal</title>
  <meta name="description" content="Warm-Blooded Mammal — new EP coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f9f8f6;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .photo {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .ep {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      text-align: center;
    }

    .email {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: #888;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .email:hover { color: #1a1a1a; }
  </style>
</head>
<body>

  <img src="band.jpg" alt="Warm-Blooded Mammal" class="photo">
  <h1>Warm-Blooded Mammal</h1>
  <p class="ep">New EP Coming Soon</p>
  <a href="mailto:warmbloodedband@gmail.com" class="email">warmbloodedband@gmail.com</a>

</body>
</html>
