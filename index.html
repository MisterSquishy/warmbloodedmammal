<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warm-Blooded Mammal</title>
  <meta name="description" content="Warm-Blooded Mammal — new EP coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .photo {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      margin-bottom: 2rem;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .photo.loaded { opacity: 1; }

    h1 {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #f2f2f2;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .ep {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      text-align: center;
    }

    .email {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: #888;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .email:hover { color: #f2f2f2; }

    .instagram {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: #888;
      text-decoration: none;
      text-align: center;
      display: block;
      letter-spacing: 0.05em;
    }

    .instagram:hover { color: #f2f2f2; }
  </style>
</head>
<body>

  <picture>
    <source srcset="band.webp" type="image/webp">
    <img src="band.jpg" alt="Warm-Blooded Mammal" class="photo">
  </picture>
  <h1>Warm-Blooded Mammal</h1>
  <p class="ep">New EP Coming Soon</p>
  <a href="mailto:warmbloodedband@gmail.com" class="email">warmbloodedband@gmail.com</a>
  <a href="https://www.instagram.com/warmbloodedmammal_band" class="instagram" target="_blank" rel="noopener">@warmbloodedmammal_band</a>

  <script>
    const img = document.querySelector('.photo');
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'));
  </script>
</body>
</html>
